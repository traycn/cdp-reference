name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint-typecheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck

  # Migrations go up, down and up again on a clean Postgres 16, and the schema
  # dump from each `up` must match the committed db/schema.sql. dbmate runs from
  # the same pinned image as docker-compose.yml, so pg_dump output is identical.
  migrate:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16.15@sha256:a902560563d3a5661228585f53474c5065e7f273b21ffd77e555a8b5682c5690
        env:
          POSTGRES_USER: cdp
          POSTGRES_PASSWORD: cdp_ci_only
          POSTGRES_DB: cdp
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cdp -d cdp"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      DBMATE_IMAGE: ghcr.io/amacneil/dbmate:2.37.0@sha256:0101fcc9999596f4a6930e5627296cd91f3bfa225e3e8c1699fc00881e439cc6
      POSTGRES_IMAGE: postgres:16.15@sha256:a902560563d3a5661228585f53474c5065e7f273b21ffd77e555a8b5682c5690
      DATABASE_URL: postgres://cdp:cdp_ci_only@localhost:5432/cdp?sslmode=disable
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Images match docker-compose.yml
        run: |
          grep -qF "$DBMATE_IMAGE" docker-compose.yml
          grep -qF "$POSTGRES_IMAGE" docker-compose.yml
      - name: Define helpers
        run: |
          cat > "$RUNNER_TEMP/helpers.sh" <<'EOF'
          dbmate() {
            docker run --rm --network host \
              -e DATABASE_URL \
              -e DBMATE_MIGRATIONS_DIR=/db/migrations \
              -e DBMATE_SCHEMA_FILE=/db/schema.sql \
              -v "$GITHUB_WORKSPACE/db:/db" \
              "$DBMATE_IMAGE" --wait "$@"
          }
          psql_q() {
            docker run --rm --network host --entrypoint psql "$DBMATE_IMAGE" \
              "$DATABASE_URL" -v ON_ERROR_STOP=1 -Atc "$1"
          }
          schema_matches_committed() {
            if [ -n "$(git status --porcelain -- db/schema.sql)" ]; then
              echo "::error file=db/schema.sql::Schema dump differs from the committed db/schema.sql. Run 'pnpm db:migrate' and commit it."
              git diff -- db/schema.sql
              return 1
            fi
          }
          EOF
      - name: dbmate up
        run: |
          . "$RUNNER_TEMP/helpers.sh"
          dbmate up
          schema_matches_committed
      - name: rolling back every migration leaves nothing behind
        run: |
          . "$RUNNER_TEMP/helpers.sh"
          for _ in db/migrations/*.sql; do dbmate rollback; done
          left="$(psql_q "
            SELECT nspname FROM pg_namespace WHERE nspname IN ('raw', 'staging', 'core', 'eval')
            UNION ALL SELECT extname FROM pg_extension WHERE extname = 'uuid-ossp'
            UNION ALL SELECT version FROM public.schema_migrations")"
          if [ -n "$left" ]; then
            echo "::error::rollback left objects behind: $left"
            exit 1
          fi
      - name: dbmate up again
        run: |
          . "$RUNNER_TEMP/helpers.sh"
          dbmate up
          schema_matches_committed

  # vitest in every workspace package that has a `test` script. The coverage
  # gates (attribution 100% branch, marketing-logic ≥ 90% line) go into those
  # packages' test scripts with their first tests in M5–M6.
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  # Development seeds only; held-out seeds stay unrun until acceptance-frozen.
  # For each seed: generate twice (byte-identical, hash equal to
  # services/ingest/seed-hashes.json), counts inside docs/acceptance.md ranges,
  # then load twice (the second load must change no row and no max(loaded_at)).
  # Then, per seed, stitch twice: row counts and the profile hash must not change.
  seed-idempotency:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16.15@sha256:a902560563d3a5661228585f53474c5065e7f273b21ffd77e555a8b5682c5690
        env:
          POSTGRES_USER: cdp
          POSTGRES_PASSWORD: cdp_ci_only
          POSTGRES_DB: cdp
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cdp -d cdp"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      DBMATE_IMAGE: ghcr.io/amacneil/dbmate:2.37.0@sha256:0101fcc9999596f4a6930e5627296cd91f3bfa225e3e8c1699fc00881e439cc6
      DATABASE_URL: postgres://cdp:cdp_ci_only@localhost:5432/cdp?sslmode=disable
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: dbmate up
        run: |
          docker run --rm --network host \
            -e DATABASE_URL \
            -e DBMATE_MIGRATIONS_DIR=/db/migrations \
            -e DBMATE_SCHEMA_FILE=/tmp/schema.sql \
            -v "$GITHUB_WORKSPACE/db:/db:ro" \
            "$DBMATE_IMAGE" --wait --no-dump-schema up
      - name: Generate and load the development seeds twice
        working-directory: services/ingest
        run: node verify.ts --seed 42 --seed 7 --seed 1234
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: services/stitch/uv.lock
      - name: Stitch each seed twice; the profile hash must not change
        run: |
          for seed in 42 7 1234; do
            (cd services/ingest && node load.ts --dir "../../.data/seed-$seed")
            (cd services/stitch && uv run --locked cdp-stitch idempotency)
          done

  # Development seeds only. Generate, load, stitch and evaluate each seed, then
  # write the results page. Fails if non-hazard precision (per seed and mean),
  # completeness, safety or event attachment miss their docs/acceptance.md bars.
  # Wrong attachment (against the floor, ADR 0004) and same-name pairs with both
  # DOBs merged (ADR 0001) are known misses: reported, not failed.
  stitch-eval:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16.15@sha256:a902560563d3a5661228585f53474c5065e7f273b21ffd77e555a8b5682c5690
        env:
          POSTGRES_USER: cdp
          POSTGRES_PASSWORD: cdp_ci_only
          POSTGRES_DB: cdp
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cdp -d cdp"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      DBMATE_IMAGE: ghcr.io/amacneil/dbmate:2.37.0@sha256:0101fcc9999596f4a6930e5627296cd91f3bfa225e3e8c1699fc00881e439cc6
      DATABASE_URL: postgres://cdp:cdp_ci_only@localhost:5432/cdp?sslmode=disable
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: services/stitch/uv.lock
      - name: uv sync
        working-directory: services/stitch
        run: uv sync --locked
      - name: dbmate up
        run: |
          docker run --rm --network host \
            -e DATABASE_URL \
            -e DBMATE_MIGRATIONS_DIR=/db/migrations \
            -e DBMATE_SCHEMA_FILE=/tmp/schema.sql \
            -v "$GITHUB_WORKSPACE/db:/db:ro" \
            "$DBMATE_IMAGE" --wait --no-dump-schema up
      - name: Generate, load, stitch and evaluate the development seeds
        run: scripts/stitch-eval.sh 42 7 1234
      - name: Check the bars
        working-directory: services/stitch
        run: |
          uv run --locked cdp-stitch report --seed 42 --seed 7 --seed 1234 \
            --out "$RUNNER_TEMP/results.md" --check
      - name: Results to the job summary
        if: always()
        run: '[ ! -f "$RUNNER_TEMP/results.md" ] || cat "$RUNNER_TEMP/results.md" >> "$GITHUB_STEP_SUMMARY"'
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: stitch-eval
          path: .data/eval/

  # Rebuilds docs/results.md from scratch (generate, load, stitch, evaluate,
  # report) and fails if it differs from the committed file. Any drift shows up
  # here, including in the known misses.
  reproduce:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16.15@sha256:a902560563d3a5661228585f53474c5065e7f273b21ffd77e555a8b5682c5690
        env:
          POSTGRES_USER: cdp
          POSTGRES_PASSWORD: cdp_ci_only
          POSTGRES_DB: cdp
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cdp -d cdp"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      DBMATE_IMAGE: ghcr.io/amacneil/dbmate:2.37.0@sha256:0101fcc9999596f4a6930e5627296cd91f3bfa225e3e8c1699fc00881e439cc6
      DATABASE_URL: postgres://cdp:cdp_ci_only@localhost:5432/cdp?sslmode=disable
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: services/stitch/uv.lock
      - name: uv sync
        working-directory: services/stitch
        run: uv sync --locked
      - name: dbmate up
        run: |
          docker run --rm --network host \
            -e DATABASE_URL \
            -e DBMATE_MIGRATIONS_DIR=/db/migrations \
            -e DBMATE_SCHEMA_FILE=/tmp/schema.sql \
            -v "$GITHUB_WORKSPACE/db:/db:ro" \
            "$DBMATE_IMAGE" --wait --no-dump-schema up
      - name: Generate, load, stitch and evaluate the development seeds
        run: scripts/stitch-eval.sh 42 7 1234
      - name: Regenerate docs/results.md
        working-directory: services/stitch
        run: |
          uv run --locked cdp-stitch report --seed 42 --seed 7 --seed 1234 \
            --out ../../docs/results.md
      - name: docs/results.md matches the committed file
        run: |
          if ! git diff --exit-code -- docs/results.md; then
            echo "::error file=docs/results.md::docs/results.md differs from a fresh run. Regenerate it with scripts/stitch-eval.sh and cdp-stitch report, and commit it."
            exit 1
          fi
